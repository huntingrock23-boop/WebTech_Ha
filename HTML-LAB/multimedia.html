<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB ACTIVITY 9: Multimedia</title>
</head>
<body>

    <header>
        <h1>LAB ACTIVITY 9: Multimedia Elements</h1>
    </header>

    <main>
        <section>
            <h2>1. Image Element</h2>
            <img src="download.webp" alt="" width="600" height="300">
        </section>

        <section>
            <h2>2. Audio Element</h2>
            <audio controls>
                <source src="sample-audio.mp3" type="audio/mpeg">
                <source src="sample-audio.ogg" type="audio/ogg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <section>
            <h2>3. Video Element</h2>
            <video width="640" height="360" controls>
                <source src="sample-video.mp4" type="video/mp4">
                <source src="sample-video.webm" type="video/webm">
                Your browser does not support the video element.
            </video>
        </section>

        <section>
            <h2>4. Embedded Educational Video</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/e_04ZrNroTo" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Development Student. All Rights Reserved.</p>
    </footer>

</body>
</html>
